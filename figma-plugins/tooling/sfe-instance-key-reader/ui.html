<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: "Inter", -apple-system, sans-serif;
        margin: 0;
        padding: 12px;
        font-size: 12px;
        color: #242424;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 4px;
      }
      .count {
        color: #616161;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        height: 400px;
        box-sizing: border-box;
        font-family: "SF Mono", Menlo, monospace;
        font-size: 11px;
        border: 1px solid #d1d1d1;
        border-radius: 4px;
        padding: 8px;
        resize: none;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        padding: 6px 12px;
        border: 1px solid #d1d1d1;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 12px;
      }
      button.primary {
        background: #0f6cbd;
        color: #fff;
        border-color: #0f6cbd;
      }
      .hint {
        color: #909090;
        margin-top: 6px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>SFE instance keys</h1>
    <div class="count" id="count">Reading…</div>
    <textarea id="out" readonly spellcheck="false"></textarea>
    <div class="row">
      <button class="primary" id="copy">Copy JSON</button>
      <button id="close">Close</button>
    </div>
    <div class="hint">Copy this and paste it back to Cosmo — these are the published keys.</div>
    <script>
      let jsonText = "";
      onmessage = (e) => {
        const msg = e.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "error") {
          const c = document.getElementById("count");
          c.textContent = "Error: " + msg.message;
          c.style.color = "#b10e1c";
          return;
        }
        if (msg.type !== "result") return;
        jsonText = JSON.stringify(msg, null, 2);
        document.getElementById("out").value = jsonText;
        document.getElementById("count").textContent =
          msg.count + ' components read from "' + msg.file + '"';
      };
      document.getElementById("copy").onclick = () => {
        const ta = document.getElementById("out");
        ta.select();
        try {
          document.execCommand("copy");
        } catch (err) {}
        const btn = document.getElementById("copy");
        btn.textContent = "Copied!";
        setTimeout(() => (btn.textContent = "Copy JSON"), 1200);
      };
      document.getElementById("close").onclick = () =>
        parent.postMessage({ pluginMessage: { type: "close" } }, "*");
    </script>
  </body>
</html>
